[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterflow"
version = "0.1.0b1"
description = "Local-first, traceable Slurm cluster workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.4,<5", "keyring>=25,<26"]

[project.scripts]
clusterflow = "clusterflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
